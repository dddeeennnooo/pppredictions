services:
  - type: web
    name: football-prediction
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FOOTBALL_PREDICTOR_DB
        value: /app/storage/football_predictor.db
    disk:
      name: football-predictor-data
      mountPath: /app/storage
      sizeGB: 1
